name: Docs validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.17"
      - name: Install Mintlify CLI
        run: npm i -g mint
      - name: Validate build
        run: mint validate
      - name: Check links
        run: mint broken-links --check-anchors --check-redirects
